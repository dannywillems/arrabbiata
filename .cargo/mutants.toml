# cargo-mutants configuration (https://mutants.rs).
#
# Mutation testing injects small bugs (a replaced operator, a function body
# returning a default) and reports the mutants no test kills: a survivor is
# a behaviour the tests do not pin. It runs through `make mutants` and
# `make mutants-diff`, and in the Mutants workflow, never in the main CI.

# Proofs make some test suites slow; a mutant that loops is cut at three
# times the baseline duration.
timeout_multiplier = 3.0

# Formatting impls only render errors and debug output; mutating them finds
# nothing about the mathematics. They are excluded below.

# Equivalent mutants, which no test can kill because the behaviour is the
# same (excluded rather than reported forever):
#
# - in `setup`, `domain.element(target % n)` and `domain.element(target + n)`
#   are both `w^target`, since `w^n = 1`;
# - the evaluations of a PlonK proof are absorbed after the last challenge,
#   so not absorbing them changes no challenge (it is kept for a protocol
#   that would squeeze after them, such as batched openings);
# - the label of a PlonK message, `rotate_left(PC::LABEL, 16) ^ TAG`, takes
#   the same value with `|`: every scheme label fits in 48 bits, so the
#   16-bit tag and the rotated label occupy disjoint bits.
exclude_re = [
  "impl (core::)?(fmt::)?(Display|Debug) for",
  "replace % with \\+ in setup",
  "Absorb<F> for Opened<T, W, X, Q>>::absorb_into",
  "replace \\^ with \\| in message_label",
]
