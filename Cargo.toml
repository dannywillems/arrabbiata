[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/dannywillems/arrabbiata"
authors = ["Danny Willems <danny@badaas.be>"]

[workspace.dependencies]
arrabbiata-bn254 = { path = "crates/ec/bn254" }
arrabbiata-codec = { path = "crates/encoding/codec" }
arrabbiata-commit = { path = "crates/commitment/commit" }
arrabbiata-curve = { path = "crates/ec/curve" }
arrabbiata-field = { path = "crates/algebra/field" }
arrabbiata-frontend = { path = "crates/arithmetization/frontend" }
arrabbiata-gadget = { path = "crates/arithmetization/gadget" }
arrabbiata-grumpkin = { path = "crates/ec/grumpkin" }
arrabbiata-generalized-plonk = { path = "crates/snark/generalized" }
arrabbiata-halo = { path = "crates/accumulation/halo" }
arrabbiata-ipa = { path = "crates/commitment/ipa" }
arrabbiata-kimchi = { path = "crates/snark/kimchi" }
arrabbiata-kimchi-gadgets = { path = "crates/gadgets/kimchi" }
arrabbiata-kzg = { path = "crates/commitment/kzg" }
arrabbiata-mvpoly = { path = "crates/algebra/mvpoly" }
arrabbiata-pasta = { path = "crates/ec/pasta" }
arrabbiata-permutation = { path = "crates/iop/permutation" }
arrabbiata-pickles = { path = "crates/snark/pickles" }
arrabbiata-plonk = { path = "crates/snark/plonk" }
arrabbiata-plonkish = { path = "crates/arithmetization/plonkish" }
arrabbiata-plonkish-folding = { path = "crates/accumulation/plonkish" }
arrabbiata-poly = { path = "crates/algebra/poly" }
arrabbiata-poseidon = { path = "crates/oracle/poseidon" }
arrabbiata-reduction = { path = "crates/reduction/knowledge" }
arrabbiata-relation = { path = "crates/arithmetization/relation" }
arrabbiata-transcript = { path = "crates/oracle/transcript" }

# Kimchi samples its permutation shifts and hashes its SRS with Blake2b
# (arrabbiata-kimchi only; approved 2026-10-16, audited: no advisory since
# RUSTSEC-2019-0019, HMAC only, < 0.8.1).
blake2 = { version = "0.11.0", default-features = false }

# Dev-only. Never in a library crate's [dependencies]: the extracted crates
# must stay dependency-free so that Charon/Aeneas see only our code.
proptest = "1.9"
# A concrete byte hash for the hash transcript's tests (approved: sha2 >= 0.10).
sha2 = { version = "0.10.9", default-features = false }

# Pairings and multi-scalar multiplications dominate the test suite; run
# tests optimized.
[profile.test]
opt-level = 3

[workspace.lints.rust]
# Aeneas only handles safe Rust. Forbid, not deny: no crate may opt out.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The extracted crates avoid closures (Aeneas), so explicit matches are
# preferred to Option combinators taking a closure.
manual_map = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
