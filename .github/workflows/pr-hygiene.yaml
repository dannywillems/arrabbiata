name: PR hygiene

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: PR hygiene checks
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TOOLBOX: https://raw.githubusercontent.com/dannywillems/toolbox/main/pr-hygiene
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download scripts
        run: |
          for script in check-pr-size.sh check-title-length.sh \
            check-no-fixup.sh check-commit-body.sh; do
            curl -sSfLO "$TOOLBOX/$script"
            chmod +x "$script"
          done
      - name: PR size
        run: ./check-pr-size.sh "$BASE_SHA"
      - name: Commit title length
        run: ./check-title-length.sh "$BASE_SHA"
      - name: No fixup commits
        run: ./check-no-fixup.sh "$BASE_SHA"
      - name: Commit bodies
        run: ./check-commit-body.sh "$BASE_SHA"
