[workspace]
resolver = "3"
members = [
  "crates/field",
  "crates/curve",
  "crates/bn254",
  "crates/pasta",
  "crates/poseidon",
  "crates/poly",
  "crates/transcript",
  "crates/commit",
  "crates/relation",
  "crates/folding",
  "crates/frontend",
  "crates/plonk",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/dannywillems/arrabbiata"
authors = ["Danny Willems <danny@badaas.be>"]

[workspace.dependencies]
arrabbiata-field = { path = "crates/field" }
arrabbiata-curve = { path = "crates/curve" }
arrabbiata-bn254 = { path = "crates/bn254" }
arrabbiata-pasta = { path = "crates/pasta" }
arrabbiata-poseidon = { path = "crates/poseidon" }
arrabbiata-poly = { path = "crates/poly" }
arrabbiata-transcript = { path = "crates/transcript" }
arrabbiata-commit = { path = "crates/commit" }
arrabbiata-relation = { path = "crates/relation" }
arrabbiata-folding = { path = "crates/folding" }
arrabbiata-frontend = { path = "crates/frontend" }
arrabbiata-plonk = { path = "crates/plonk" }

# Dev-only. Never in a library crate's [dependencies]: the extracted crates
# must stay dependency-free so that Charon/Aeneas see only our code.
proptest = "1.9"

# Pairings and multi-scalar multiplications dominate the test suite; run
# tests optimized.
[profile.test]
opt-level = 3

[workspace.lints.rust]
# Aeneas only handles safe Rust. Forbid, not deny: no crate may opt out.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The extracted crates avoid closures (Aeneas), so explicit matches are
# preferred to Option combinators taking a closure.
manual_map = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
